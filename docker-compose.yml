services:
  postgres:
    image: postgres:16-alpine
    container_name: prozorro-postgres
    environment:
      POSTGRES_DB: prozorro_data_mining
      POSTGRES_USER: prozorro
      POSTGRES_PASSWORD: prozorro
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prozorro -d prozorro_data_mining"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/ProzorroDataMining.Api/Dockerfile
    container_name: prozorro-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=prozorro_data_mining;Username=prozorro;Password=prozorro
      Cors__AllowedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__1: http://localhost:8080
    ports:
      - "5095:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: src/ProzorroDataMining.Web/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: prozorro-web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
